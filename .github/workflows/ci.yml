name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a new bwoc release that breaks an argv the adapter builds is
  # caught even when nothing changes here.
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

jobs:
  cli-contract:
    name: CLI contract (latest bwoc release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm run lint
      - name: install the latest bwoc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R bemindlabs/BWOC-Framework \
            --pattern '*-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/bwoc-*.tar.gz -C "$RUNNER_TEMP"
          bin="$(ls -d "$RUNNER_TEMP"/bwoc-*-x86_64-unknown-linux-gnu)/bwoc"
          "$bin" --version
          echo "BWOC_CONTRACT_BIN=$bin" >> "$GITHUB_ENV"
      # The other tests drive a live `bwoc list` and need a workspace, so only
      # the contract (argv parsing, nothing executed) runs here.
      - name: every argv the adapter builds parses
        run: node --test test/cli-contract.test.js
